services:
  # ChromaDB vector database
  chroma:
    image: chromadb/chroma:0.4.24
    container_name: mcp-chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=false
    volumes:
      - chroma_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 0" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # MCP Server (Java + Spring AI)
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server-java
    ports:
      - "8001:8001"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=baseline_kb
      - SERVER_PORT=8001
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - bm25_index:/data
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
  bm25_index:
    driver: local
