spring:
  application:
    name: mcp-server4j

  ai:
    mcp:
      server:
        # Server info
        name: "Knowledge Base RAG Server"
        version: "1.0.0"
        type: SYNC
        protocol: STREAMABLE

        # Enable automatic discovery of @McpTool annotated beans
        annotation-scanner:
          enabled: true

# Generate auto-configuration report (set to true for debugging)
debug: false

server:
  port: ${SERVER_PORT:8001}

# ChromaDB configuration
chroma:
  host: ${CHROMA_HOST:localhost}
  port: ${CHROMA_PORT:8000}
  collection-name: ${CHROMA_COLLECTION:baseline_kb}

# Retrieval configuration
retrieval:
  # Hybrid search weights (must sum to 1.0)
  bm25-weight: 0.3
  vector-weight: 0.7
  # Candidate pool size for hybrid fusion
  candidate-pool-size: 20

# Logging configuration
logging:
  level:
    root: INFO
    com.mcp.server: INFO
    org.springframework.ai: INFO
    org.springframework.ai.mcp: INFO
    dev.langchain4j: INFO
    org.springframework.boot.autoconfigure: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
